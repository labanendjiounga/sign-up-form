<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="left">
    <div>
      <img 
        src="./assets/img/odin-lined.png"
        alt="Lined Odin Logo"
        width="60"
        height="80"> Odin
    </div>
    <p>
        Photo by
        <a href="https://unsplash.com/@haliewestphoto" class="attr">Halie West</a>
        on
        <a href="https://unsplash.com/photos/25xggax4bSA" class="attr">Unsplash</a>
    </p>
  </div>
  <div class="right">
    <div class="header">
      <p>
        This is not a real online service! You know you need something
        like this in your life to help you realize your deepest dreams.
        Sign up <em>now</em> to get started.</p>
      <p>You <em>know</em> you want to.</p>
    </div>
    <div class="main">
      <p>
        Let's do this!
      </p>
      <form action="" method="get" id="user_account_creation">
        <div class="top">
          <div class="form-controls">
            <label for="first_name">First name</label>
            <input type="text" name="user_first_name" id="first_name">
          </div>
          <div class="form-controls">
            <label for="last_name">Last name</label>
            <input type="text" name="user_last_name" id="last_name">
          </div>
        </div>
        <div class="mid">
          <div class="form-controls">
            <label for="email">Email</label>
            <input type="email" name="user_email" id="email">
          </div>
          <div class="form-controls">
            <label for="phone_number">Phone number</label>
            <input type="tel" name="user_phone_number" id="phone_number">
          </div>
        </div>
        <div class="btm">
          <div class="form-controls">
            <label for="password">Password</label>
            <input type="password" name="user_password" id="password" pattern="[0-9a-fA-F]{4,8}" required>
          </div>
          <div class="form-controls">
            <label for="confirm_password">Confirm password</label>
            <input type="password" name="user_confirm_password" id="confirm_password" pattern="[0-9a-fA-F]{4,8}" required>
          </div>       
        </div>
      </form>
    </div>
    <div class="footer">
      <button form="user_account_creation">
        Create Account
      </button>
      <p>
        Already have an account? <a href="#">Log in</a>
      </p>
    </div>
  </div>
</body>
</html>
